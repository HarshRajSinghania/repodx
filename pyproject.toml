[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repodx"
version = "0.3.2"
description = "Check your AI-built project for leaked secrets, unsafe Supabase/Firebase config and committed junk before you push."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Omer", email = "omersukrubektas@gmail.com" }]
dependencies = []
keywords = ["secrets", "security", "gitignore", "supabase", "firebase", "vibe-coding", "pre-commit", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/omerbek/repodx"
Source = "https://github.com/omerbek/repodx"
Issues = "https://github.com/omerbek/repodx/issues"
Changelog = "https://github.com/omerbek/repodx/blob/main/CHANGELOG.md"

[project.scripts]
repodx = "repodx:cli"

[tool.setuptools]
py-modules = ["repodx"]
