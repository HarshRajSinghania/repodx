name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover

      - name: Check that the tag matches the version
        run: |
          version=$(python3 -c "import repodx; print(repodx.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match repodx.__version__ $version" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          notes = match.group(1).strip() if match else "See CHANGELOG.md."
          notes += (
              "\n\n**Run it without installing:**\n\n"
              "```bash\n"
              f"curl -sSL https://github.com/omerbek/repodx/releases/download/v{version}/repodx.py | python3 - .\n"
              "```"
          )
          open("notes.md", "w", encoding="utf-8").write(notes)
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" repodx.py --title "RepoDx $GITHUB_REF_NAME" --notes-file notes.md
