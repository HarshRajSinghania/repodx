name: Missed problem
description: RepoDx did not report something it should have.
labels: [missed-detection]
body:
  - type: textarea
    id: what
    attributes:
      label: What should RepoDx have found?
      description: For secrets, describe the provider and key format. Use a fake key of the same shape, never a real one.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where does it usually appear?
      placeholder: "For example: src/lib/supabase.ts in apps generated by Lovable"
